
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Fortune</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
  }

  body {
    background-image: url('assets/haikeip.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 100vh;
    min-height: 100dvh;
  }

  /* 戻るボタン */
  #backButton {
    width: 250px;
    position: fixed;
    top: 80px;
    left: 20px;
    cursor: pointer;
    z-index: 100;
  }

  /* ルーレット全体 */
  #roulette {
    position: relative;
    width: min(600px, 90vw);
    aspect-ratio: 1 / 1;
    cursor: pointer;
  }

  /* 回転する丸 */
  #maru {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    top: 0;
    left: 0;
  }

  /* 矢印 */
  #yajirushi {
    position: absolute;
    width: 100%;
    height: auto;
    object-fit: contain;

    top: -100px;
    left: -100px;

    z-index: 2;
    pointer-events: none;
  }

  /* 結果画像 */
  #result {
    display: none;
    width: min(600px, 90vw);
    height: auto;
    object-fit: contain;
    cursor: pointer;
  }

  /* スマートフォン */
  @media (max-width: 600px) {
    #backButton {
      width: 160px;
      top: 50px;
      left: 10px;
    }

    #roulette {
      width: 90vw;
    }

    #result {
      width: 90vw;
    }

    #yajirushi {
      width: 90%;
      top: -50px;
      left: -50px;
    }
  }
</style>
</head>

<body>

<img id="backButton" src="assets/back.png" alt="戻る">

<main>

  <!-- ルーレット -->
  <div id="roulette">
    <img id="maru" src="assets/maru.png" alt="ルーレット">
    <img id="yajirushi" src="assets/yajirushi.png" alt="矢印">
  </div>

  <!-- 運勢の結果 -->
  <img id="result" src="" alt="今日の運勢">

</main>

<script>

  // ==================================
  // Cloudflare Workerに回数を記録
  // ==================================

  async function recordSpin() {
    try {
      const response = await fetch(
        "https://stumbletoastcounter.stumbletoast-stumbletoast.workers.dev/spin",
        {
          method: "POST"
        }
      );

      if (!response.ok) {
        throw new Error("Counter API error: " + response.status);
      }

      console.log("ルーレット回数を記録しました！");

    } catch (error) {
      console.error("記録に失敗しました:", error);
    }
  }


  // ==================================
  // 戻るボタン
  // ==================================

  document.getElementById('backButton').onclick = () => {
    location.href = "index.html";
  };


  // ==================================
  // ルーレットの設定
  // ==================================

  const roulette = document.getElementById('roulette');
  const maru = document.getElementById('maru');
  const result = document.getElementById('result');


  // 運勢の画像
  const fortunes = [
    "assets/D.png",
    "assets/C.png",
    "assets/G.png",
    "assets/O.png"
  ];

  let isSpinning = false;
  let rotation = 0;


  // ==================================
  // ルーレットを回す
  // ==================================

  function spinRoulette() {

    // 回転中の連続クリックを防止
    if (isSpinning) return;

    isSpinning = true;

    // Cloudflareに回数を記録
    recordSpin();

    // ルーレットを表示して結果を隠す
    roulette.style.display = "block";
    result.style.display = "none";

    // 回転角度を維持してリセット
    maru.style.transition = "none";
    maru.style.transform = `rotate(${rotation}deg)`;

    maru.offsetWidth;

    // 5周以上ランダムに回転
    const extraRotation = 360 * 5 + Math.random() * 360;

    rotation += extraRotation;

    // 2.5秒間回転
    maru.style.transition = "transform 2.5s linear";
    maru.style.transform = `rotate(${rotation}deg)`;


    // 回転終了後、1秒待って結果を表示
    setTimeout(() => {

      setTimeout(() => {

        const randomIndex = Math.floor(
          Math.random() * fortunes.length
        );

        result.src = fortunes[randomIndex];

        roulette.style.display = "none";
        result.style.display = "block";

        isSpinning = false;

      }, 1000);

    }, 2500);

  }


  // ==================================
  // クリックイベント
  // ==================================

  // ルーレットをタップしてスタート
  roulette.onclick = spinRoulette;

  // 結果画像をタップしてもう一度回す
  result.onclick = spinRoulette;


</script>

</body>
</html>
