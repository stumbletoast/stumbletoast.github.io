<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    background-image: url('assets/haikeip.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px 80px;
    box-sizing: border-box;
  }

  #backButton {
    width: 250px;
    position: fixed;
    top: 80px;
    left: 20px;
    cursor: pointer;
    z-index: 100;
  }

  /* 中央のポスター */
  #poster {
    display: block;
    width: min(500px, 80vw);
    height: auto;
    margin: 20px auto 40px;
  }

  /* 下部の写真：元の比率を保って大きめに表示 */
  #photoGallery {
    display: flex;
    justify-content: center;
    align-items: center;
    width: min(700px, 90vw);
  }

  .galleryPhoto {
    display: block;
    width: 180px;
    height: auto;
    object-fit: contain;
    cursor: pointer;
  }

  /* 写真の拡大表示 */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(255, 255, 255, 0.65);
    justify-content: center;
    align-items: center;
  }

  #lightbox.open {
    display: flex;
  }

  #largePhoto {
    display: block;
    width: auto;
    height: auto;
    max-width: 85vw;
    max-height: 90vh;
    object-fit: contain;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: black;
    background: transparent;
    border: none;
    font-size: 48px;
    cursor: pointer;
    padding: 20px;
  }

  #prevButton {
    left: 20px;
  }

  #nextButton {
    right: 20px;
  }

  #closeButton {
    position: absolute;
    top: 20px;
    right: 25px;
    color: black;
    background: transparent;
    border: none;
    font-size: 40px;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    body {
      background-position: center top;
      padding-top: 120px;
    }

    #backButton {
      width: 160px;
      top: 50px;
      left: 10px;
    }

    #poster {
      width: 85vw;
      margin-bottom: 30px;
    }

    .galleryPhoto {
      width: 130px;
    }

    #largePhoto {
      max-width: 90vw;
      max-height: 82vh;
    }

    .arrow {
      font-size: 36px;
      padding: 10px;
    }

    #prevButton {
      left: 0;
    }

    #nextButton {
      right: 0;
    }
  }
</style>
</head>

<body>

  <img id="backButton" src="assets/back.png" alt="戻る">

  <main>
    <img id="poster" src="assets/jfposter.png" alt="ポスター">

    <div id="photoGallery">
      <img class="galleryPhoto" src="assets/1paris.JPG" alt="写真1">
    </div>
  </main>

  <div id="lightbox">
    <button id="closeButton" aria-label="閉じる">×</button>
    <button class="arrow" id="prevButton" aria-label="前の写真">‹</button>
    <img id="largePhoto" src="" alt="拡大写真">
    <button class="arrow" id="nextButton" aria-label="次の写真">›</button>
  </div>

  <script>
    document.getElementById('backButton').onclick = () => {
      location.href = "index.html";
    };

    const photos = [
      "assets/1paris.JPG",
      "assets/2paris.JPG",
      "assets/3paris.JPG",
      "assets/4paris.JPG",
      "assets/5paris.JPG",
      "assets/6paris.JPG"
    ];

    const lightbox = document.getElementById('lightbox');
    const largePhoto = document.getElementById('largePhoto');
    let currentIndex = 0;

    function showPhoto(index) {
      currentIndex = (index + photos.length) % photos.length;
      largePhoto.src = photos[currentIndex];
    }

    document.querySelector('.galleryPhoto').onclick = () => {
      showPhoto(0);
      lightbox.classList.add('open');
    };

    document.getElementById('prevButton').onclick = () => {
      showPhoto(currentIndex - 1);
    };

    document.getElementById('nextButton').onclick = () => {
      showPhoto(currentIndex + 1);
    };

    document.getElementById('closeButton').onclick = () => {
      lightbox.classList.remove('open');
    };

    lightbox.onclick = (event) => {
      if (event.target === lightbox) {
        lightbox.classList.remove('open');
      }
    };

    document.addEventListener('keydown', (event) => {
      if (!lightbox.classList.contains('open')) return;

      if (event.key === 'ArrowLeft') {
        showPhoto(currentIndex - 1);
      } else if (event.key === 'ArrowRight') {
        showPhoto(currentIndex + 1);
      } else if (event.key === 'Escape') {
        lightbox.classList.remove('open');
      }
    });
  </script>

</body>
</html>
