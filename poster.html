<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page</title>

<style>
  /* 基本設定：余白をなくし、画面いっぱいに広げる */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
  }

  /* 背景 */
  body {
    background-image: url('assets/haikeip.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* 戻るボタン */
  #backButton {
    width: 250px;
    position: fixed;
    top: 80px;
    left: 20px;
    cursor: pointer;
    z-index: 100;
  }

  /* 2つのボタンを縦並びにする */
  .buttonContainer {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
  }

  /* ボタンの共通設定 */
  #jfbutton,
  #leonbutton {
    width: 1000px;
    max-width: 50%;
    height: auto;
    cursor: pointer;
    z-index: 10;
  }

  /* スマホ用の調整 */
  @media (max-width: 600px) {
    #backButton {
      width: 160px;
      top: 50px;
      left: 10px;
    }

    /* スマホ用のボタンサイズ */
    #jfbutton,
    #leonbutton {
      width: 350px;
      max-width: 80%;
    }

    /* スマホ用のボタン間隔 */
    .buttonContainer {
      gap: 20px;
    }

    body {
      background-position: center top;
    }
  }
</style>
</head>

<body>

  <img id="backButton" src="assets/back.png" alt="戻る">

  <div class="buttonContainer">

    <img id="jfbutton" src="assets/jf.png" alt="JF">

    <img id="leonbutton" src="assets/leon.png" alt="Leon">

  </div>

  <script>
    // 戻るボタンをクリックした時、index.htmlに戻る
    document.getElementById('backButton').onclick = () => {
      location.href = "index.html";
    };

    // JFのボタンをクリックした時
    document.getElementById('jfbutton').onclick = () => {
      location.href = "jf.html";
    };

    // Leonのボタンをクリックした時
    document.getElementById('leonbutton').onclick = () => {
      location.href = "leon.html";
    };
  </script>

</body>
</html>
