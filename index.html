<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUMBLETOAST!!</title>

<style>
body {
  margin: 0;
  background: #ffffff;
  font-family: sans-serif;
}

/* タイトル */
#title {
  text-align: center;
  margin-top: 60px;
  font-size: 1.5em;
  letter-spacing: 0.2em;
}

/* ボタンエリア */
.buttonRow {
  margin-top: 100px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* ボタン */
#nextButton {
  width: 400px;
  cursor: pointer;
  transform: translate(-200px, -200px);
}

#thirdButton {
  width: 50px;
  height: auto;
  cursor: pointer;
  transform: translate(0px, 0px);
}

#fourthButton {
  width: 100px;
  height: auto;
  cursor: pointer;
  transform: translate(-300px, 400px);
}

#fifthButton {
  width: 200px;
  height: auto;
  cursor: pointer;
  transform: translate(50px, 600px);
}

#shopButton {
  width: 200px;
  height: auto;
  cursor: pointer;
  transform: translate(-110px, 90px);
}

#exhibitionButton {
  width: 180px;
  height: auto;
  cursor: pointer;
  transform: translate(-500px, 500px);
}

#magazineButton {
  width: 40px;
  height: auto;
  cursor: pointer;
  transform: translate(-900px, 600px);
}

#posterButton {
  width: 300px;
  height: auto;
  cursor: pointer;
  position: absolute;
  transform: translate(400px, 300px);
}

/* 運勢ボタン */
#fortuneButton {
  width: 130px;
  height: auto;
  cursor: pointer;
  transform: translate(-1340px, 600px);
}

/* スマホ用 */
@media (max-width: 600px) {

  #nextButton {
    width: 70vw;
    max-width: 250px;
    transform: translate(70px, 0);
  }

  #thirdButton {
    width: 5vw;
    max-width: 80px;
    transform: translate(0px, -20px);
  }

  #fourthButton {
    width: 15vw;
    max-width: 150px;
    transform: translate(-20px, 220px);
  }

  #fifthButton {
    width: 20vw;
    max-width: 150px;
    transform: translate(-50px, 400px);
  }

  #shopButton {
    width: 28vw;
    max-width: 150px;
    transform: translate(-60px, 300px);
  }

  #exhibitionButton {
    width: 30vw;
    max-width: 150px;
    transform: translate(-170px, 100px);
  }

  #magazineButton {
    width: 6vw;
    max-width: 100px;
    transform: translate(-200px, 500px);
  }

  #posterButton {
    width: 160px;
    max-width: 180px;
    position: absolute;
    transform: translate(100px, -70px);
  }

  #fortuneButton {
  width: 18vw;
  max-width: 150px;
  position: absolute;
  transform: translate(-140px, 500px);
}



  }


</style>
</head>

<body>

<h1 id="title">STUMBLETOAST!!</h1>

<div class="buttonRow">

  <img id="nextButton" src="assets/1B.png" alt="次のページ">

  <img id="thirdButton" src="assets/2B.png" alt="ページ2">

  <img id="fourthButton" src="assets/3B.png" alt="ページ3">

  <img id="fifthButton" src="assets/4B.png" alt="ページ4">

  <img id="shopButton" src="assets/shop.png" alt="ショップ">

  <img id="exhibitionButton" src="assets/exhibition.png" alt="展示">

  <img id="magazineButton" src="assets/magazine.png" alt="雑誌">

  <img id="posterButton" src="assets/poster.png" alt="ポスター">

  <img id="fortuneButton" src="assets/f.png" alt="今日の運勢">

  

</div>

<script>
document.getElementById("nextButton").onclick = () => {
  location.href = "next.html";
};

document.getElementById("thirdButton").onclick = () => {
  location.href = "third.html";
};

document.getElementById("fourthButton").onclick = () => {
  location.href = "fourth.html";
};

document.getElementById("shopButton").onclick = () => {
  location.href = "shop.html";
};

document.getElementById("exhibitionButton").onclick = () => {
  location.href = "nextphoto.html";
};

document.getElementById("magazineButton").onclick = () => {
  location.href = "magazine.html";
};

document.getElementById("posterButton").onclick = () => {
  location.href = "poster.html";
};

document.getElementById("fortuneButton").onclick = () => {
  location.href = "rureto.html";
};
</script>

</body>
</html>
