
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
  }

  body {
    background-image: url('assets/haikeip.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 30px;
  }

  /* 戻るボタン */
  #backButton {
    width: 250px;
    position: fixed;
    top: 80px;
    left: 20px;
    cursor: pointer;
    z-index: 100;
  }

  /* 中央の画像ボタン */
  #ffbutton,
  #ffbutton2 {
    width: 500px;
    max-width: 50%;
    cursor: pointer;
    z-index: 10;
  }

  /* スマホ用 */
  @media (max-width: 600px) {
    #backButton {
      width: 160px;
      top: 50px;
      left: 10px;
    }

    #ffbutton,
    #ffbutton2 {
      width: 200px;
      max-width: 70%;
    }

    body {
      background-position: center top;
      gap: 20px;
    }
  }
</style>
</head>

<body>

  <img id="backButton" src="assets/back.png" alt="戻る">

  <img id="ffbutton" src="assets/ffbutton.png" alt="FF">

  <img id="ffbutton2" src="assets/ffbutton2.png" alt="IFM Paris">

  <script>
    // 戻るボタン：index.htmlに戻る
    document.getElementById('backButton').onclick = () => {
      location.href = "index.html";
    };

    // ffbuttonをクリック
    document.getElementById('ffbutton').onclick = () => {
      location.href = "ff.html";
    };

    // ffbutton2をクリック
    document.getElementById('ffbutton2').onclick = () => {
      location.href = "ifmparis.html";
    };
  </script>

</body>
</html>
